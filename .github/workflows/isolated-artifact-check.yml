name: AgentForge isolated artifact check

on:
  workflow_dispatch:
    inputs:
      source_filename:
        description: "Python source filename (for example solution.py)"
        required: true
        type: string
        default: solution.py
      source_b64:
        description: "Base64-encoded Python source, max 12 KB decoded"
        required: true
        type: string
      test_filename:
        description: "pytest filename beginning with test_ (for example test_solution.py)"
        required: true
        type: string
        default: test_solution.py
      test_b64:
        description: "Base64-encoded pytest source, max 12 KB decoded"
        required: true
        type: string

permissions:
  contents: read

jobs:
  isolated-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository (no credentials are passed into the sandbox)
        uses: actions/checkout@v4

      - name: Validate and materialize bounded artifacts
        env:
          SOURCE_FILENAME: ${{ inputs.source_filename }}
          SOURCE_B64: ${{ inputs.source_b64 }}
          TEST_FILENAME: ${{ inputs.test_filename }}
          TEST_B64: ${{ inputs.test_b64 }}
          OUTPUT_DIR: ${{ runner.temp }}/agentforge-artifacts
        run: |
          python - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          source_name = os.environ["SOURCE_FILENAME"]
          test_name = os.environ["TEST_FILENAME"]
          source_pattern = re.compile(r"^[A-Za-z][A-Za-z0-9_]{0,63}\.py$")
          test_pattern = re.compile(r"^test_[A-Za-z0-9_]{1,58}\.py$")
          if not source_pattern.fullmatch(source_name) or ".." in source_name:
              raise SystemExit("Rejected source filename")
          if not test_pattern.fullmatch(test_name) or ".." in test_name:
              raise SystemExit("Rejected test filename")
          if source_name == test_name:
              raise SystemExit("Source and test filenames must differ")

          def decode(name):
              try:
                  data = base64.b64decode(os.environ[name], validate=True)
              except Exception:
                  raise SystemExit(f"Rejected invalid base64 input: {name}")
              if not data or len(data) > 12_000:
                  raise SystemExit(f"Rejected artifact size for {name}")
              if b"\x00" in data:
                  raise SystemExit(f"Rejected NUL byte in {name}")
              return data

          output = Path(os.environ["OUTPUT_DIR"])
          output.mkdir(mode=0o755, parents=True, exist_ok=False)
          (output / source_name).write_bytes(decode("SOURCE_B64"))
          (output / test_name).write_bytes(decode("TEST_B64"))
          print("Validated two bounded Python files; source contents are not logged.")
          PY

      - name: Build sandbox image
        run: docker build --pull -t agentforge-artifact-sandbox:ci backend/sandbox

      - name: Execute untrusted artifact tests in isolated container
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/agentforge-artifacts
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --memory=256m \
            --cpus=1 \
            --pids-limit=64 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --user 65534:65534 \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            --mount "type=bind,src=${ARTIFACT_DIR},dst=/work,readonly" \
            agentforge-artifact-sandbox:ci
