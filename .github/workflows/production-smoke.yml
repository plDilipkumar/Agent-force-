name: AgentForge production smoke

on:
  push:
    branches:
      - test/production-smoke-runner-20261020-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live API, auth, planning, and artifact generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, uuid, urllib.request, urllib.error

          API = "https://agentforge-api-ina0.onrender.com"
          ORIGIN = "https://agentforge-inky.vercel.app"

          def request(path, method="GET", payload=None, token=None, origin=None, timeout=110):
              headers = {}
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["Content-Type"] = "application/json"
              if token:
                  headers["Authorization"] = "Bearer " + token
              if origin:
                  headers["Origin"] = origin
              req = urllib.request.Request(API + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      body = resp.read().decode()
                      return resp.status, dict(resp.headers.items()), json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode()
                  try: parsed = json.loads(body)
                  except Exception: parsed = {"detail": body[:180]}
                  return exc.code, dict(exc.headers.items()), parsed

          status, _, health = request("/health")
          assert status == 200 and health.get("status") == "ok" and health.get("service") == "agentforge-api", ("health", status, health)
          print("PASS: health endpoint")

          req = urllib.request.Request(
              API + "/api/run",
              data=b"",
              headers={"Origin": ORIGIN, "Access-Control-Request-Method": "POST",
                       "Access-Control-Request-Headers": "content-type,authorization"},
              method="OPTIONS",
          )
          with urllib.request.urlopen(req, timeout=25) as resp:
              assert resp.status == 200, ("CORS status", resp.status)
              h = {k.lower(): v for k, v in resp.headers.items()}
              assert h.get("access-control-allow-origin") == ORIGIN, ("CORS origin", h)
              assert "POST" in h.get("access-control-allow-methods", ""), ("CORS method", h)
              assert "authorization" in h.get("access-control-allow-headers", "").lower(), ("CORS headers", h)
          print("PASS: production CORS preflight")

          email = "agentforge-smoke-" + uuid.uuid4().hex + "@example.com"
          password = "Smoke-" + uuid.uuid4().hex + "-A9!"
          status, _, registered = request("/api/auth/register", "POST", {"email": email, "password": password}, origin=ORIGIN)
          assert status == 201 and registered.get("access_token"), ("registration", status, registered)
          token = registered["access_token"]
          status, _, me = request("/api/auth/me", token=token, origin=ORIGIN)
          assert status == 200 and me.get("email") == email, ("authenticated session", status, me)
          status, _, logged_in = request("/api/auth/login", "POST", {"email": email, "password": password}, origin=ORIGIN)
          assert status == 200 and logged_in.get("access_token"), ("login", status, logged_in)
          print("PASS: registration, session validation, and login")

          status, _, plan = request("/api/run", "POST", {
              "task": "Design a secure document upload API",
              "context": "PDF files up to 10 MB",
              "stack": "FastAPI + React",
              "mode": "balanced"
          }, token=logged_in["access_token"], origin=ORIGIN)
          assert status == 200, ("task planning", status, plan)
          assert isinstance(plan.get("summary"), str) and plan["summary"].strip(), ("plan summary", plan)
          assert isinstance(plan.get("tasks"), list) and plan["tasks"], ("plan tasks", plan)
          assert all(t.get("priority") in {"P0", "P1", "P2"} for t in plan["tasks"]), ("plan priorities", plan)
          assert isinstance(plan.get("verification"), list) and plan["verification"], ("plan verification", plan)
          print("PASS: authenticated task-to-plan flow; provider=" + str(plan.get("provider", "unknown"))[:100])

          status, _, artifact = request("/api/artifacts", "POST", {
              "task": "Create a pure Python addition function and pytest cases",
              "context": "Deterministic only; no network or shell"
          }, token=logged_in["access_token"], origin=ORIGIN)
          assert status == 200, ("artifact generation", status, artifact)
          assert artifact.get("language") == "python", ("artifact language", artifact)
          assert artifact.get("verification_status") == "generated", ("artifact status", artifact)
          assert isinstance(artifact.get("code"), str) and 0 < len(artifact["code"]) <= 12000, ("artifact code", artifact)
          assert isinstance(artifact.get("test_code"), str) and 0 < len(artifact["test_code"]) <= 12000, ("artifact tests", artifact)
          assert "ready for review" in artifact.get("safety_notice", "").lower(), ("artifact notice", artifact)
          print("PASS: authenticated artifact generation and response bounds")
          print("ALL PRODUCTION SMOKE CHECKS PASSED")
          PY
